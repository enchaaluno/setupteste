version: "3.7"

# Stack do Encha Setup Panel para Docker Swarm.
#
# Esta stack é criada/atualizada pela API do Portainer (POST/PUT
# /api/stacks), não por `docker stack deploy` direto no host — é o que a
# torna editável (compose + variáveis) no editor de stacks do Portainer.
# Ver deploy_stack_painel_via_portainer() em secondary.sh. Mantenha este
# arquivo em sincronia com o heredoc equivalente em
# secondary.sh (ferramenta_encha_panel) — eles precisam ser idênticos.
#
# Variáveis interpoladas pelo Env da stack no Portainer (edite lá para
# alterar em produção — "Update the stack" reaplica):
#   - ENCHA_PANEL_HOST      domínio público (ex: painel.exemplo.com)
#   - PANEL_IMAGE_TAG       tag da imagem do painel (ex: 0.1.0, latest)
#   - PANEL_ADMIN_USER      usuário do admin local do painel
#   - PANEL_ADMIN_PASSWORD  senha do admin local do painel (texto puro —
#                           é o que permite reset via Portainer; SEMPRE
#                           vence sobre PANEL_ADMIN_PASSWORD_FILE — ver
#                           lerSegredo() em src/lib/security/segredo.ts)
#   - PORTAINER_USER        credencial de serviço p/ o painel falar com o Portainer
#   - PORTAINER_PASSWORD    idem (mesma regra de precedência sobre
#                           PORTAINER_PASSWORD_FILE)
#   - PANEL_ADMIN_PASSWORD_FILE / PORTAINER_PASSWORD_FILE — Ciclo C9 (M3 do
#     plano de segurança): caminho do Docker secret montado (sempre
#     "/run/secrets/panel_admin_password" / "/run/secrets/portainer_password"
#     quando a imagem entende _FILE — label com.encha.painel.recursos do C4;
#     vazio numa imagem antiga, que ignora estas duas). Ver
#     garantir_segredos_credenciais_painel() em secondary.sh.
#   - PANEL_ADMIN_PASSWORD_SECRET_NAME / PORTAINER_PASSWORD_SECRET_NAME —
#     qual secret versionado ("<base>_<epoch>") o mount abaixo aponta pra
#     dentro de cada deploy; cai no secret "_bootstrap" (sempre presente,
#     idempotente) quando ainda não houve nenhuma migração bem-sucedida.
#
# ENCHA_PANEL_NETWORK é a exceção: continua resolvida por envsubst antes do
# deploy (aparece como chave de `networks:`, que a API do Portainer não
# interpola) — não é necessário torná-la editável.
#
# Pré-requisitos:
#   1. Traefik + Portainer já instalados (mesma rede overlay).
#   2. Swarm Secret 'encha_panel_master_key' criado (32 bytes random):
#        openssl rand 32 | docker secret create encha_panel_master_key -
#   3. Volume externo 'encha_panel_data' criado:
#        docker volume create encha_panel_data
#   4. Diretório /root/dados_vps presente no host (criado pelo instalador bash).
#   5. Secrets 'panel_admin_password'/'portainer_password' (versionados,
#      rotacionados a cada deploy) e seus "_bootstrap" fixos — ver
#      garantir_segredos_credenciais_painel() em secondary.sh; nunca criados
#      à mão.
#
# Deploy: ver deploy_stack_painel_via_portainer() em secondary.sh
# (ferramenta_encha_panel). Não usar `docker stack deploy` para esta stack —
# quebra a edição via Portainer.

services:
  panel:
    image: ghcr.io/enchaaluno/setup-panel:${PANEL_IMAGE_TAG}
    networks:
      - ${ENCHA_PANEL_NETWORK}
    secrets:
      - source: encha_panel_master_key
        target: master_key
        mode: 0444
      # uid/gid 1001 = usuário "nextjs" do Dockerfile (USER nextjs). Sem eles
      # o Swarm monta o arquivo como root:root, e com mode 0400 o painel não
      # consegue ler a própria senha (EACCES -> lerSegredo devolve undefined:
      # admin local cai no passthrough do Portainer, credencial de serviço dá
      # 503). Medido no Portainer 2.45.1 real (auditoria C9).
      - source: panel_admin_password
        target: panel_admin_password
        uid: "1001"
        gid: "1001"
        mode: 0400
      - source: portainer_password
        target: portainer_password
        uid: "1001"
        gid: "1001"
        mode: 0400
    volumes:
      - encha_panel_data:/app/data
      - /root/dados_vps:/app/vps-context:ro
    environment:
      - NODE_ENV=production
      - PORTAINER_URL=http://portainer_portainer:9000
      - DB_PATH=/app/data/panel.db
      - VPS_CONTEXT_DIR=/app/vps-context
      # Vazio de propósito, mas NÃO porque o Monitor esteja descontinuado —
      # ele voltou a ser a fonte de releases/termos/auto-update do Encha
      # Setup (monitor.encha.com.br). O vazio aqui é um limite de segurança:
      # monitor.ts trata este valor com `||`, não `??`, então uma string
      # vazia cai no domínio fixo em código, e o operador nunca consegue
      # apontar o painel pra um MONITOR_BASE_URL arbitrário (ver o comentário
      # em fetchWithTimeout — é o vetor de sequestro de domínio que isso
      # fecha). Trocar este valor aqui não muda nada; o domínio de verdade
      # só muda recompilando o painel.
      - MONITOR_BASE_URL=
      - PANEL_ADMIN_USER=${PANEL_ADMIN_USER}
      - PANEL_ADMIN_PASSWORD=${PANEL_ADMIN_PASSWORD}
      - PORTAINER_USER=${PORTAINER_USER}
      - PORTAINER_PASSWORD=${PORTAINER_PASSWORD}
      - PANEL_ADMIN_PASSWORD_FILE=${PANEL_ADMIN_PASSWORD_FILE}
      - PORTAINER_PASSWORD_FILE=${PORTAINER_PASSWORD_FILE}
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      update_config:
        order: start-first
        failure_action: rollback
      rollback_config:
        order: start-first
      restart_policy:
        condition: on-failure
        max_attempts: 5
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          memory: 128M
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=${ENCHA_PANEL_NETWORK}"
        - "traefik.http.routers.encha-panel.rule=Host(`${ENCHA_PANEL_HOST}`)"
        - "traefik.http.routers.encha-panel.entrypoints=websecure"
        - "traefik.http.routers.encha-panel.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.encha-panel.service=encha-panel"
        - "traefik.http.services.encha-panel.loadbalancer.server.port=3000"

secrets:
  encha_panel_master_key:
    external: true
  panel_admin_password:
    external: true
    name: ${PANEL_ADMIN_PASSWORD_SECRET_NAME:-panel_admin_password_bootstrap}
  portainer_password:
    external: true
    name: ${PORTAINER_PASSWORD_SECRET_NAME:-portainer_password_bootstrap}

volumes:
  encha_panel_data:
    external: true
    name: encha_panel_data

networks:
  ${ENCHA_PANEL_NETWORK}:
    external: true
    name: ${ENCHA_PANEL_NETWORK}
