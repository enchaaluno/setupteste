name: release

# Disparado só pelo Monitor (POST /repos/.../workflows/release.yml/dispatches,
# ver github-dispatch.ts) quando o admin clica "Publicar" em /admin/builds.
# Nunca rodar à mão sem passar pelos dois inputs corretos — 'version' e
# 'commit_sha' vêm do build escolhido no log, não são digitados livremente.
#
# Ordem importa (dá a reversibilidade do processo): a imagem sobe para o
# GHCR ANTES de qualquer push no git. Se o build da imagem falhar, nenhuma
# tag ou commit chega a existir no remoto — retry limpo. Se pusséssemos a
# tag primeiro, uma falha de imagem deixaria v$VERSION apontando pra um
# commit sem imagem correspondente, sem jeito limpo de desfazer.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versão a publicar (X.Y.Z, sem 'v')"
        required: true
      commit_sha:
        description: "Commit exato do build escolhido em /admin/builds"
        required: true

run-name: "release ${{ inputs.version }} (${{ inputs.commit_sha }})"

jobs:
  publish:
    if: github.repository == 'enchaaluno/setupteste'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      BUILDS_INGEST_SECRET: ${{ secrets.BUILDS_INGEST_SECRET }}
      VERSION: ${{ inputs.version }}
      COMMIT_SHA: ${{ inputs.commit_sha }}
    steps:
      - name: Validar formato da versão
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Versão inválida: '$VERSION' — precisa ser X.Y.Z sem prefixo 'v' e sem pré-release."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
          # GITHUB_TOKEN com permissions.contents:write acima — precisa
          # dele autenticado no remote pra dar `git push` mais adiante.
          persist-credentials: true

      - name: Reportar início ao Monitor
        run: bash .github/scripts/report-publish.sh running "$VERSION" "$COMMIT_SHA"

      - name: Bump de versão nos 5 arquivos
        run: |
          bash .github/scripts/set-version.sh "$VERSION"
          bash .github/scripts/verify-version.sh

      - name: Commit local do bump (ainda não pushado)
        run: |
          git config user.name "encha-release-bot"
          git config user.email "noreply@encha.ai"
          git add main.sh secondary.sh \
            encha-setup-panel/package.json encha-setup-panel/package-lock.json \
            encha-setup-panel/src/lib/version.ts
          git commit -m "release: v$VERSION"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A imagem é REBUILDADA aqui, nunca "retagueada" a partir do
      # sha-<short> do build.yml. APP_VERSION fica compilado dentro do
      # bundle do Next — um retag criaria um manifesto novo apontando pro
      # MESMO bundle antigo, que continuaria reportando a versão velha.
      # update-checker.tsx espera current===target depois do update e
      # desiste em 300s; um retag faria ISSO ACONTECER SEMPRE, mesmo numa
      # publicação "bem-sucedida" — loop de nag infinito na frota inteira.
      - name: Build + push da imagem versionada
        id: image
        uses: docker/build-push-action@v6
        with:
          context: ./encha-setup-panel
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/enchaaluno/setup-panel:${{ env.VERSION }}
            ghcr.io/enchaaluno/setup-panel:latest

      - name: Push do commit para main (fast-forward)
        run: |
          # Sem --force: se main avançou desde que este commit foi
          # escolhido pra publicar, o push é rejeitado pelo próprio git
          # como non-fast-forward — é essa rejeição que garante que nunca
          # rebaseamos um bump de versão em cima de código não testado.
          if ! git push origin HEAD:main; then
            echo "::error::main avançou desde o build escolhido — publique o build mais recente em vez deste."
            exit 1
          fi
          git tag "v$VERSION"
          git push origin "v$VERSION"

      - name: Validar o tarball publicado
        run: |
          # Baixa exatamente o que um cliente vai baixar (host-updater.ts)
          # e confirma que a versão bate — testa o caminho real, não só o
          # commit local.
          curl -fsSL "https://codeload.github.com/enchaaluno/setupteste/tar.gz/refs/tags/v$VERSION" -o /tmp/release.tgz
          mkdir -p /tmp/release-check
          tar -xzf /tmp/release.tgz -C /tmp/release-check --strip-components=1
          installed=$(grep -m1 '^ENCHA_VERSION=' /tmp/release-check/secondary.sh | sed -E 's/^ENCHA_VERSION="([^"]*)"/\1/')
          if [ "$installed" != "$VERSION" ]; then
            echo "::error::Tarball da tag v$VERSION contém ENCHA_VERSION=$installed — algo divergiu."
            exit 1
          fi
          echo "OK: tarball da tag v$VERSION confirma ENCHA_VERSION=$installed"

      - name: Push no espelho (best-effort)
        # continue-on-error: o espelho é opcional e não pode derrubar uma
        # release já publicada. O script, porém, sai com 1 e escreve no resumo
        # da run quando falha — o 403 de um token vencido ficou escondido aqui
        # e o espelho parou em v0.2.5 sem ninguém ver.
        continue-on-error: true
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_PUSH_TOKEN }}
        run: bash .github/scripts/push-mirror.sh "$VERSION"

      - name: Capturar digest da imagem
        if: success()
        id: digest
        run: echo "digest=${{ steps.image.outputs.digest }}" >> "$GITHUB_OUTPUT"

      - name: Reportar sucesso ao Monitor
        if: success()
        run: bash .github/scripts/report-publish.sh done "$VERSION" "$COMMIT_SHA" "" "${{ steps.digest.outputs.digest }}"

      - name: Reportar falha ao Monitor
        if: failure()
        run: bash .github/scripts/report-publish.sh failed "$VERSION" "$COMMIT_SHA" "Falha em '${{ github.job }}' — ver ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
